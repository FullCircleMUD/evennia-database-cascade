[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-database-cascade"
version = "0.0.1"
description = "Resolves an Evennia game's database aliases from the environment — a database of its own, the game's, or a local SQLite file — and derives the routers to match."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "mud", "django", "database", "database-router", "multi-database"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "evennia",
    # Parses DATABASE_URL and DATABASE_URL_<ALIAS> into a DATABASES entry.
    "dj-database-url",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-database-cascade"
Repository = "https://github.com/FullCircleMUD/evennia-database-cascade"
Issues = "https://github.com/FullCircleMUD/evennia-database-cascade/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_database_cascade*"]
